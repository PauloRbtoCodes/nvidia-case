# Configuração do Alembic.
#
# `sqlalchemy.url` está deliberadamente ausente: a URL vem de
# Settings.database_url (ou seja, do .env), resolvida em migrations/env.py.
# Duplicar a credencial aqui garantiria que um dia as duas divergissem — e
# migrations aplicadas no banco errado é o tipo de erro que não tem desfazer.

[alembic]
script_location = %(here)s/migrations

# `src` no path porque o pacote mora em src/radar e o env.py importa o metadata
# real das tabelas — autogenerate comparando com o código, não com um espelho.
prepend_sys_path = %(here)s/src:%(here)s
path_separator = os

# Prefixo temporal no nome do arquivo: a ordem das migrations no diretório passa
# a ser a ordem cronológica, que é como se lê o histórico do projeto.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
