# ---------------------------------------------------------------------------
# ENRIQUECIMENTO MANUAL — a peça que faz o motor de recomendação funcionar.
#
# A documentação oficial explica O QUE cada tecnologia faz, mas nunca QUANDO
# recomendá-la. Sem estes cards, o RAG responde "o que é o Triton" e falha em
# "qual tecnologia serve para esta startup". São escritos à mão em
# data/nvidia_cards/*.md e ingeridos junto com as URLs acima.
# ---------------------------------------------------------------------------
cards_manuais:
  path: data/nvidia_cards/
  schema:
    - technology
    - problema_que_resolve
    - sinais_de_que_a_startup_precisa    # observáveis pelo scraper
    - pre_requisitos
    - complexidade                        # baixa | media | alta
    - eixo_defensibilidade                # qual gap do score isto endereça
    - primeira_acao_sugerida
